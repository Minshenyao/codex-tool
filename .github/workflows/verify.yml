name: Verify on macOS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check sources and build
        run: |
          test "$(uname -m)" = arm64
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          node --check files/launcher.js
          node --check files/verify.js
          go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/codex-tool" .
          "$RUNNER_TEMP/codex-tool" --help
